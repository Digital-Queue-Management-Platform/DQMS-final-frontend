name: Deploy Frontend to SLT VM

on:
  push:
    branches:
      - feat/slt-vm-new
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64, frontend]

    steps:
      - name: Mark repo as safe
        shell: cmd
        run: git config --global --add safe.directory C:/DQMS-final-frontend

      - name: Update frontend working copy
        shell: cmd
        run: |
          cd /d C:\DQMS-final-frontend
          git fetch origin
          git checkout feat/slt-vm-new
          git reset --hard origin/feat/slt-vm-new

      - name: Install dependencies
        shell: cmd
        run: |
          cd /d C:\DQMS-final-frontend
          npm install

      - name: Build frontend
        shell: cmd
        run: |
          cd /d C:\DQMS-final-frontend
          npm run build

      - name: Clean deployed frontend
        shell: cmd
        run: |
          if exist C:\nginx\html\dqms\assets rmdir /S /Q C:\nginx\html\dqms\assets
          if exist C:\nginx\html\dqms\index.html del /Q C:\nginx\html\dqms\index.html

      - name: Copy build to nginx
        shell: cmd
        run: |
          xcopy /E /I /Y C:\DQMS-final-frontend\dist\* C:\nginx\html\dqms\

      - name: Reload nginx
        shell: cmd
        run: |
          cd /d C:\nginx
          nginx.exe -t
          nginx.exe -s reload